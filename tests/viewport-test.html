<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>375px 뷰포트 검증</title></head>
<body>
<!-- DESIGN.md 마이그레이션 4번 검증: 헤드리스 Chrome은 최소 창폭이 500px라
     375px 화면을 직접 못 만든다. 같은 출처 iframe(375px)으로 각 페이지의
     scrollWidth와 히어로 숫자 줄 수를 측정해 DOM에 출력한다. -->
<pre id="out">측정 중…</pre>
<div id="frames"></div>
<script>
(function () {
  var pages = [
    '/index.html?demo=1',
    '/tax/avante-1.6.html',
    '/tax/grandeur-3.5.html',
    '/tax/index.html',
    '/tax/calculator.html',
    '/tco.html',
    '/privacy.html'
  ];
  var results = [];
  var done = 0;
  pages.forEach(function (p) {
    var f = document.createElement('iframe');
    f.width = 375; f.height = 900; f.src = p;
    f.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var d = f.contentDocument;
          var sw = d.documentElement.scrollWidth;
          var line = p + ' | scrollWidth=' + sw + (sw <= 376 ? ' [OK]' : ' [OVERFLOW]');
          var hero = d.querySelector('.tax-hero, .odo-km');
          if (hero) {
            var cs = f.contentWindow.getComputedStyle(hero);
            var lineH = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.3;
            var oneLine = hero.getBoundingClientRect().height < lineH * 1.6;
            line += ' | 히어로 ' + (oneLine ? '1줄 [OK]' : '[줄바꿈!]');
          }
          results.push(line);
        } catch (e) {
          results.push(p + ' | [ERROR] ' + e.message);
        }
        done += 1;
        if (done === pages.length) {
          document.getElementById('out').textContent = '측정 완료\n' + results.sort().join('\n');
        }
      }, 1500);
    });
    document.getElementById('frames').appendChild(f);
  });
})();
</script>
</body>
</html>
